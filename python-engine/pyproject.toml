[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slate-python-engine"
version = "0.1.0"
description = "Lossless Python structure and patch engine for Slate"
requires-python = ">=3.11"
dependencies = [
    "libcst==1.8.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
