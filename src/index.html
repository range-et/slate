<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=undo" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="ColorPalette.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="overlay">
        <div id="modal">
            <div id="modal-content"></div>
            <div id="modal-actions"></div>
        </div>
    </div>


    <div id="container">
        <div id="topbar">
            <h3 style="font-family: 'couriers new', monospace;">slate</h3> 
                <h4>| ADD / REMOVE DOC</h4>
            <button class="success_btn" id="add_doc">+</button>
            <button class="alert_btn" id="remove_doc">—</button>
            <h4>| SEARCH CARDS / DOCS </h4>
            <input type="text" placeholder="Search..." id="search_input">
            <button class="info_btn" id="search_btn">SEARCH</button>
            <h4>| </h4>
            <button class="finish_btn" id="export_btn">EXPORT</button>
            <button class="success_btn" id="import_btn">IMPORT</button>
            <div style="flex: 1;"></div>
            <button class="info_btn" id="api_key_btn">API KEY</button>
        </div>
        <div id="content">
            <!-- NETWORK SECTION -->
            <div id="network">
                <div class="network_heading">
                    <h4>PROJECT :</h4>
                    <input type="text" id="project_title_input" placeholder="untitled project" maxlength="100">
                    <button class="info_btn" id="resetZoom">RESET ZOOM</button>
                </div>
            </div>
            <!-- DOC SECTION -->
            <div id="doc">
                <div class="doc_heading">
                    <h4>DOC :</h4>
                    <input type="text" id="doc_title_input" placeholder="untitled" maxlength="100">
                    <button class="info_btn" id="summary_btn">SUMMARY</button>
                </div>
                
                <div class="card_container" id="doc-content" style="flex: 1 1 0;">
                    
                </div>
            </div>
            <!-- CHAT SECTION -->
            <div id="chat">
                <div class="chat_title_heading">
                    <h4>CARD :</h4>
                    <input type="text" id="card_title_input" placeholder="enter card title..." maxlength="100">
                </div>
                
                <h4>CHAT</h4>
                <div class="card_container" id="chat-content"></div>
                

                <h4>PROMPT</h4>
                <div class="response_container">
                    <div id="image-preview-container"></div>
                    <div id="chat-prompt"></div>
                    <div class="response_control_panel">
                        <button class="info_btn" id="send_prompt">SEND</button>
                        <button class="info_btn" id="add_to_doc">ADD TO DOC</button>
                        <button class="info_btn" id="attach_image">ATTACH IMAGE</button>
                    </div>
                    
                </div>

                
            </div>
        </div>
    </div>  

    <script type="module" src="main_script.js"></script>
</body>

</html>
