<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Monad System design tokens — served from design-tokens/build/ via publicDir -->
    <link rel="stylesheet" href="/monad.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=undo" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="slate_palette.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="overlay">
        <div id="modal">
            <div id="modal-content"></div>
            <div id="modal-actions"></div>
        </div>
    </div>


    <div id="container">
        <div id="topbar">
            <h3 class="app-title">Slate</h3> 
                <h4>| ADD / REMOVE DOC</h4>
            <button class="success_btn" id="add_doc">+</button>
            <button class="alert_btn" id="remove_doc">—</button>
            <h4>| SEARCH CARDS / DOCS </h4>
            <input type="text" placeholder="Search..." id="search_input">
            <button class="info_btn" id="search_btn">SEARCH</button>
            <h4>| </h4>
            <button class="finish_btn" id="export_btn">EXPORT</button>
            <button class="success_btn" id="import_btn">IMPORT</button>
            <div style="flex: 1;"></div>
            <button class="info_btn" id="about_btn">ABOUT</button>
            <button class="info_btn" id="feedback_btn">FEEDBACK</button>
            <button class="info_btn" id="api_key_btn">API KEY</button>
            <button class="strata-toggle" data-mn-theme-toggle aria-label="Toggle theme" title="Toggle light/dark theme">◑</button>
        </div>
        <div id="content">
            <!-- CHAT SECTION -->
            <div id="chat" class="panel">
                <div class="panel-header chat_title_heading">
                    <h4>Card</h4>
                    <input type="text" id="card_title_input" placeholder="enter card title..." maxlength="100">
                </div>
                <div class="panel-body">
                    <h4>Prompt</h4>
                    <div class="response_container">
                        <div id="image-preview-container"></div>
                        <div id="chat-prompt"></div>
                        <div class="response_control_panel">
                            <button class="info_btn" id="attach_image">ATTACH IMAGE</button>
                            <button class="info_btn" id="code_toggle" aria-pressed="false" title="Toggle code-card mode for the next generation">CODE</button>
                            <button class="info_btn" id="send_prompt">SEND</button>
                            <button class="info_btn" id="add_to_doc">ADD TO DOC</button>
                        </div>
                    </div>
                    <h4>Chat</h4>
                    <div class="card_container" id="chat-content"></div>
                </div>
            </div>
            <div class="content-resizer" id="resizer-chat-doc" aria-label="Resize chat and document"></div>
            <!-- DOC SECTION -->
            <div id="doc" class="panel">
                <div class="panel-header doc_heading">
                    <h4>Doc</h4>
                    <input type="text" id="doc_title_input" placeholder="untitled" maxlength="100">
                    <button class="info_btn" id="summary_btn">SUMMARY</button>
                    <button class="info_btn" id="compile_btn" title="Compile this doc's code cards into a .py file">COMPILE</button>
                </div>
                <div class="panel-body">
                    <div class="card_container" id="doc-content" style="flex: 1 1 0;"></div>
                </div>
            </div>
            <div class="content-resizer" id="resizer-doc-network" aria-label="Resize document and network"></div>
            <!-- NETWORK SECTION -->
            <div id="network" class="panel">
                <div class="panel-header network_heading">
                    <h4>Project</h4>
                    <input type="text" id="project_title_input" placeholder="untitled project" maxlength="100">
                    <button class="info_btn" id="resetZoom">RESET ZOOM</button>
                </div>
                <!-- SVG appended here by NetworkViz -->
            </div>
        </div>
        <nav class="bottom-tabs" id="bottom-tabs" aria-label="Switch section">
            <button type="button" class="mobile-tab active" data-panel="chat" aria-pressed="true">Chat</button>
            <button type="button" class="mobile-tab" data-panel="doc" aria-pressed="false">Doc</button>
            <button type="button" class="mobile-tab" data-panel="network" aria-pressed="false">Network</button>
        </nav>
        <footer class="status-bar" id="status-bar">
            <span class="status-bar-item" id="status-bar-project">Slate</span>
        </footer>
    </div>  

    <script src="/monad.js"></script>
    <script type="module" src="main_script.js"></script>
</body>

</html>
