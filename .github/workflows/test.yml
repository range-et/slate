name: tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix vscode-extension
      - run: python -m pip install pytest pydantic mutmut
      - run: npm run verify:contracts
      - run: npm run verify:baseline

  harness-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pydantic mutmut
      - run: npm ci
      - run: npm ci --prefix vscode-extension
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:qa
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-browser-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  launch-gate:
    name: Launch gate
    runs-on: ubuntu-latest
    needs: [vitest, harness-ui]
    if: always()
    steps:
      - name: Require both baseline and UX/QA suites
        env:
          BASELINE_RESULT: ${{ needs.vitest.result }}
          QA_RESULT: ${{ needs.harness-ui.result }}
        run: test "$BASELINE_RESULT" = success && test "$QA_RESULT" = success
